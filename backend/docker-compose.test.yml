services:
  db_test:
    image: postgres:16-alpine
    container_name: beezpet-db-test
    environment:
      POSTGRES_DB: beezpet_test
      POSTGRES_USER: beezpet_test
      POSTGRES_PASSWORD: beezpet_test_pass
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beezpet_test"]
      interval: 3s
      timeout: 3s
      retries: 10
